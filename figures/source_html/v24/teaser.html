<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REVEAL teaser — paper revision v24</title>
<style>
  /* Editable 1000 x 536 canvas; export at native size and scale as one figure in LaTeX. */
  @page { size: 1000px 536px; margin: 0; }
  :root { --ink: #222a33; --gray: #7b8590; --rule: #cfd5dc; --green: #2e8b62; --red: #c24a3f; --die: #7a3b2e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 536px; background: #fff; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; color: var(--ink); }

  .panel { position: absolute; border: 1.5px solid var(--rule); border-radius: 12px; background: #f6f7f9; }
  .panel.hit { border-color: var(--green); background: #edf6f1; }

  /* ---------- four frames ---------- */
  .strip { position: absolute; left: 0; top: 236px; width: 1000px; height: 300px; }
  .phases { position: absolute; left: 0; top: 9px; width: 1000px; height: 26px; }
  .phase { position: absolute; top: 0; font-size: 16.5px; font-weight: 700; text-align: center; white-space: nowrap; }
  .phase i { display: block; height: 1.5px; margin-top: 4px; background: currentColor; opacity: .45; }
  .frame.hit { outline: 3px solid var(--green); outline-offset: -3px; }
  .frames { position: absolute; left: 0; top: 38px; width: 1000px; height: 215px; }
  .frame { position: absolute; top: 0; width: 215px; height: 215px; border-radius: 8px; overflow: hidden; }
  .frame img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .tstamp { position: absolute; left: 8px; top: 8px; padding: 2px 7px 3px; border-radius: 9px;
    font-size: 14px; font-weight: 700; color: #fff; background: rgba(0,0,0,.6); }
  .goal { position: absolute; right: 10px; top: 10px; width: 58px; height: 58px; }
  .goal .face { width: 58px; height: 58px; border-radius: 9px; border: 2px solid #fff;
    box-shadow: 0 2px 7px rgba(0,0,0,.55); display: block; }
  .goal .ok { position: absolute; left: -10px; bottom: -10px; width: 25px; height: 25px; }
  .arrow { position: absolute; top: 92px; width: 30px; height: 30px; }

  /* ---------- bottom: Simulation | REVEAL | Real-world ---------- */
  .row2 { position: absolute; left: 0; top: 0; width: 1000px; height: 234px; }
  .group { position: absolute; top: 8px; width: 316px; }
  .ghead { display: flex; align-items: center; justify-content: center; height: 20px; font-size: 16.5px; font-weight: 700; }
  .tiles { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-top: 6px; }
  .tile img { display: block; width: 100%; height: 78px; object-fit: cover; border-radius: 7px; }
  .tile span { display: block; margin-top: 2px; text-align: center; font-size: 14.5px; color: var(--gray); white-space: nowrap; }
  .sim .tile { width: 100px; }
  .real .tile { width: 154px; }
  .real .tile img { object-position: 50% 45%; }

  .center { position: absolute; left: 332px; top: 0; width: 336px; height: 234px; text-align: center; }
  .wordmark { margin-top: 56px; font-weight: 700; font-size: 68px; letter-spacing: 1px; color: var(--ink); line-height: 1; }
  .say { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; padding: 8px 16px 8px 10px;
    font-size: 18px; white-space: nowrap; border: 1.5px solid var(--rule); border-radius: 22px; }
  .sub { margin-top: 9px; font-size: 15px; line-height: 1.3; color: var(--gray); }
  .sub b { display: block; color: var(--ink); font-size: 16.5px; }
  .down { position: absolute; left: 156px; top: 198px; width: 24px; height: 32px; }
  .thoughts { position: absolute; left: 0; top: 258px; width: 1000px; height: 40px; }
  .thought { position: absolute; top: 0; width: 215px; display: flex; align-items: center; justify-content: center; gap: 9px;
    font-size: 15px; line-height: 1.25; font-style: normal; color: #4a5560; white-space: nowrap; }
  .thought .bot { width: 31px; height: 31px; flex: none; }
  .thought.hit { color: var(--green); }
  .thought b { font-style: normal; }
  .say svg { width: 26px; height: 26px; border-radius: 5px; display: block; }
</style>
</head>
<body>

<div class="strip">
  <div class="phases" id="phases"></div>
  <div class="frames" id="frames"></div>
  <div class="thoughts" id="thoughts"></div>
</div>

<div class="row2">
  <div class="group sim" style="left:8px">
    <div class="ghead">Simulation</div>
    <div class="tiles">
      <div class="tile"><img src="assets/sim_cube.jpg"><span>Cube</span></div>
      <div class="tile"><img src="assets/sim_ball.jpg"><span>Ball</span></div>
      <div class="tile"><img src="assets/sim_duck.jpg"><span>Duck</span></div>
      <div class="tile"><img src="assets/sim_die.jpg"><span>Dice</span></div>
      <div class="tile"><img src="assets/sim_hedgehog.jpg"><span>Hedgehog</span></div>
      <div class="tile"><img src="assets/sim_milk.jpg"><span>Milk carton</span></div>
    </div>
  </div>

  <div class="center">
    <div class="wordmark">REVEAL</div>
    <div class="say"><span class="g"></span>&ldquo;Show the six-dot face.&rdquo;</div>

    <svg class="down" viewBox="0 0 24 32" fill="none" stroke="#7b8590" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v26M6 20l6 6 6-6"/></svg>
  </div>

  <div class="group real" style="left:676px">
    <div class="ghead">Real-world</div>
    <div class="tiles">
      <div class="tile"><img src="assets/real43_cube.jpg"><span>Cube</span></div>
      <div class="tile"><img src="assets/real43_ball.jpg"><span>Ball</span></div>
      <div class="tile"><img src="assets/real43_duck.jpg"><span>Duck</span></div>
      <div class="tile"><img src="assets/real43_die.jpg"><span>Dice</span></div>
    </div>
  </div>
</div>

<script>
  // Target icon: a drawn six-dot face (an illustration of the language goal, not a goal image fed to the system).
  // Each inset is the face the frame shows to the camera, drawn as an icon.
  const PIPS = { 1: [[20,20]], 3: [[9,31],[20,20],[31,9]], 4: [[11,11],[11,29],[29,11],[29,29]],
                 6: [[12,9],[12,20],[12,31],[28,9],[28,20],[28,31]] };
  const face = (n, cls) => `<svg class="${cls}" viewBox="0 0 40 40"><rect width="40" height="40" fill="var(--die)"/>${
    PIPS[n].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="#fff"/>`).join('')}</svg>`;
  const badge = hit => `<svg class="ok" viewBox="0 0 25 25"><circle cx="12.5" cy="12.5" r="11" fill="var(--${hit ? 'green' : 'red'})" stroke="#fff" stroke-width="2"/>
    <path d="${hit ? 'M7.5 13l3.5 3.5 6.5-8' : 'M8 8l9 9M17 8l-9 9'}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  document.querySelector('.say .g').outerHTML = face(6, '');

  // Illustrative agent reasoning, one per frame (replace with logged agent output if available).
  const BOT = `<svg class="bot" viewBox="0 0 54 54" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 12V6"/><circle cx="27" cy="4.5" r="2.4" fill="currentColor" stroke="none"/>
    <rect x="9" y="12" width="36" height="32" rx="9"/><path d="M5 24v9M49 24v9"/>
    <circle cx="20" cy="25.5" r="3.8" fill="currentColor" stroke="none"/><circle cx="34" cy="25.5" r="3.8" fill="currentColor" stroke="none"/>
    <path d="M20 35.5h14"/></svg>`;
  const SAY = [ ['Four dots.', 'Inspect.'], ['One dot.', 'Inspect again.'],
                ['Three dots.', 'Inspect again.'], ['Six dots.', 'Bind and present.'] ];

  // Four frames of one real video, in recorded order (0, 8, 16, 30 s).
  const W = 215, X = [10, 265, 520, 775], AX = [230, 485, 740];
  const F = [ { img: 't00', t: '0 s', face: 4 }, { img: 't08_bal', t: '8 s', face: 1 }, { img: 't16', t: '16 s', face: 3 }, { img: 't30', t: '30 s', face: 6, hit: true } ];
  const fr = document.getElementById('frames'), th = document.getElementById('thoughts');
  F.forEach((f, i) => {
    const x = X[i];
    th.insertAdjacentHTML('beforeend', `<div class="thought ${f.hit ? 'hit' : ''}" style="left:${x}px">${BOT}<span>${SAY[i][0]}<br><b>${SAY[i][1]}</b></span></div>`);
    fr.insertAdjacentHTML('beforeend',
      `<div class="frame ${f.hit ? 'hit' : ''}" style="left:${x}px"><img src="assets/${f.img}.jpg">
         <div class="goal">${face(f.face, 'face')}${badge(f.hit)}</div></div>`);
    if (i < F.length - 1) fr.insertAdjacentHTML('beforeend',
      `<svg class="arrow" style="left:${AX[i]}px" viewBox="0 0 30 30" fill="none" stroke="#7b8590"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15h22M19 8l7 7-7 7"/></svg>`);
  });

  const ph = document.getElementById('phases');
  [ ['Initial observation', 10, 215, 'var(--ink)'],
    ['New views', 265, 470, 'var(--ink)'],
    ['Six-dot face shown', 775, 215, 'var(--green)'] ].forEach(([t, x, w, c]) =>
    ph.insertAdjacentHTML('beforeend', `<div class="phase" style="left:${x}px;width:${w}px;color:${c}">${t}<i></i></div>`));
</script>
</body>
</html>
